<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Sign In — ScholarSetu</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="admin-login.css" />
</head>
<body>

<div class="bg-layer" aria-hidden="true"></div>

<div class="page">

  <header class="top-bar">
    <div class="top-bar-left">
      <a href="index.html" class="brand-logo" aria-label="ScholarSetu home">
        <svg viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 24c4-9 10-14 14-14s10 5 14 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <circle cx="3" cy="25" r="2.6" fill="currentColor"/>
          <circle cx="31" cy="25" r="2.6" fill="currentColor"/>
        </svg>
      </a>
      <a href="home.html" class="back-link">
        <span class="back-arrow" aria-hidden="true">&#8592;</span>
        Back to home
      </a>
    </div>
  </header>

  <main class="login-shell">

    <section class="illustration-panel" aria-hidden="true">
      <div class="illustration-frame">
        <img class="illustration" src="admin_vector.webp" alt="" />
      </div>
    </section>

    <section class="form-panel">
      <div class="form-card">

        <p class="wordmark">ScholarSetu</p>
        <h1 class="heading">Admin sign in</h1>
        <p class="subheading">This is a preset account — manage scholarships listed on ScholarSetu.</p>

        <form id="adminLoginForm" novalidate>

          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <p class="error-text" id="adminLoginError"></p>

          <button type="submit" class="submit-btn">Sign in</button>

        </form>

      </div>
    </section>

  </main>

</div>

<script src="admin-login.js"></script>
</body>
</html>
